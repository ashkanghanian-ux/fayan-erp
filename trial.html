    + '<div class="t-grid">' + c.feat.map(function(f){return '<div class="t-card"><span class="tag ' + (f.add?'ad':'go') + '">' + (f.add?'قابل افزودن':'عملیاتی') + '</span><h3 class="' + (f.add?'add':'') + '">' + f.t + '</h3><p>' + f.d + '</p></div>';}).join("") + '</div>'
    + '<div class="t-tip"><b>چیزی می‌خواهید که در این فهرست نیست؟</b> فایان ERP با فرم‌ساز و ماژول‌های اختصاصی قابل توسعه است — بخش موردنظرتان را در <a href="proforma.html" style="color:#4f46e5;font-weight:800">پیش‌فاکتور</a> یادداشت کنید.</div>'
    + '</div>');
  }
});

main.innerHTML = H.join("");

var S = ['<div class="t-head">دسته‌بندی ماژول‌ها</div>'];
CATS.forEach(function(c){
  S.push('<div class="t-item' + (c.id===on?' on':'') + '" data-p="' + c.id + '"><span class="n">' + (ICONS[c.id] || c.n) + '</span>' + c.t + '</div>');
});
S.push('<div class="t-cta"><a class="btn btn-primary" href="demo-request.html">درخواست دموی کامل</a><a class="btn btn-ghost" href="proforma.html">پیش‌فاکتور</a></div>');
side.innerHTML = S.join("");
side.querySelectorAll(".t-item").forEach(function(el){
  el.addEventListener("click", function(){
    on = el.dataset.p;
    side.querySelectorAll(".t-item").forEach(function(x){ x.classList.toggle("on", x===el); });
    main.querySelectorAll(".trial-pano").forEach(function(p){ p.classList.toggle("on", p.dataset.p===on); });
  });
});

/* ---------- دموی زندهٔ اداری ---------- */
(function(){
  var live = document.getElementById("offLive");
  var offline = document.getElementById("offOffline");
  var pub = document.getElementById("offPublic");
  function show(el){ el.style.display = "block"; }

  var proto = location.protocol;
  if(proto === "https:"){ show(pub); return; }   // نسخهٔ عمومی سایت

  var host = location.hostname || "127.0.0.1";
  var base = (proto === "file:" ? "http://127.0.0.1:5401" : proto + "//" + host + ":5401");
  try {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", base + "/login", true);
    xhr.onload = function(){ okFlag = true; boot(true); };
    xhr.onerror = function(){ boot(false); };
    xhr.send();
  } catch(e){ boot(false); }

  function boot(ok){
    if(ok){
      document.getElementById("offFrame").src = base + "/login";
      document.getElementById("offOpen").href = base + "/login";
      document.getElementById("offUrl").textContent = base;
      show(live);
    } else {
      show(offline);
    }
  }
})();

/* ---------- تم روشن/تیره ---------- */
(function(){
  var btn = document.getElementById("themeBtn");
  function apply(t){
    document.body.classList.toggle("dark", t === "dark");
    btn.textContent = (t === "dark") ? "☀️" : "🌙";
  }
  var saved = "light";
  try { saved = localStorage.getItem("fayanTheme") || "light"; } catch(e){}
  apply(saved);
  btn.addEventListener("click", function(){
    var next = document.body.classList.contains("dark") ? "light" : "dark";
    try { localStorage.setItem("fayanTheme", next); } catch(e){}
    apply(next);
  });
})();
</script>
