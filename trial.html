var side = document.getElementById("trialSide");
var main = document.getElementById("trialMain");

function chips(list){ return list.map(function(f){ return '<label class="chk-row"><input type="checkbox" ' + (f.add?'':'checked disabled') + '>' + f.t + '</label>'; }).join(""); }

function kpis(){ return '<div class="kpi-band">'
 + '<div class="kpi"><b class="up">۹۲٪</b><span>📈 تحقق تولید امروز</span></div>'

function featCard(f, add){
  var testBtn = f.test ? '<button class="test-btn" onclick="runDemo(this)" data-msg="' + f.test + '">تست</button>' : '';
  return '<div class="t-card"><span class="tag ' + (add?'ad':'go') + '">' + (add?'قابل افزودن':'عملیاتی') + '</span><h3 class="' + (add?'add':'') + '">' + f.t + '</h3><p>' + f.d + '</p>' + testBtn + '</div>';
}

main.innerHTML = H.join("");

/* ---------- شبیه‌سازی تست هر ماژول ---------- */
function runDemo(btn){
  var card = btn.closest(".t-card");
  var msg = btn.getAttribute("data-msg");
  btn.disabled = true;
  btn.textContent = "در حال شبیه‌سازی…";
  var done = document.createElement("div");
  done.className = "test-result";
  done.textContent = "✓ " + msg;
  card.appendChild(done);
  setTimeout(function(){
    btn.disabled = false;
    btn.textContent = "تست";
    btn.classList.add("reset");
    card.querySelectorAll(".test-result").forEach(function(r){ r.remove(); });
  }, 4500);
}

var S = ['<div class="t-head">دسته‌بندی ماژول‌ها</div>'];

  S.push('<div class="t-item' + (c.id===on?' on':'') + '" data-p="' + c.id + '"><span class="n">' + (ICONS[c.id] || c.n) + '</span>' + c.t + '</div>');
});

    on = el.dataset.p;

    main.querySelectorAll(".trial-pano").forEach(function(p){ p.classList.toggle("on", p.dataset.p===on); });
  });
});

/* ---------- دموی زندهٔ اداری ---------- */
(function(){
  var live = document.getElementById("offLive");
  var offline = document.getElementById("offOffline");
  var pub = document.getElementById("offPublic");
  function show(el){ el.style.display = "block"; }

  var proto = location.protocol;
  if(proto === "https:"){ show(pub); return; }

  var host = location.hostname || "127.0.0.1";
  var base = (proto === "file:" ? "http://127.0.0.1:5401" : proto + "//" + host + ":5401");
  try {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", base + "/login", true);
    xhr.onload = function(){ boot(true); };
    xhr.onerror = function(){ boot(false); };
    xhr.send();
  } catch(e){ boot(false); }

  function boot(ok){
    if(ok){
      document.getElementById("offFrame").src = base + "/login";
      document.getElementById("offOpen").href = base + "/login";
      document.getElementById("offUrl").textContent = base;
      show(live);
    } else {
      show(offline);
    }
  }
})();

/* ---------- تم روشن/تیره ---------- */
(function(){
  var btn = document.getElementById("themeBtn");
  function apply(t){
    document.body.classList.toggle("dark", t === "dark");
    btn.textContent = (t === "dark") ? "☀️" : "🌙";
  }
  var saved = "light";
  try { saved = localStorage.getItem("fayanTheme") || "light"; } catch(e){}
  apply(saved);
  btn.addEventListener("click", function(){
    var next = document.body.classList.contains("dark") ? "light" : "dark";
    try { localStorage.setItem("fayanTheme", next); } catch(e){}
    apply(next);
  });
})();
</script>
