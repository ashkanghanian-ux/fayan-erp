<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="نمای از بالای مجموعه صنعتی">
  <defs>
    <pattern id="gridp" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#93a4c6" stroke-width="1" opacity="0.18"/>
    </pattern>
    <linearGradient id="grass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4ff"/>
      <stop offset="1" stop-color="#e7edfd"/>
    </linearGradient>
  </defs>

  <rect width="800" height="800" fill="url(#grass)"/>
  <rect width="800" height="800" fill="url(#gridp)"/>

  <!-- زمین چمن خارجی -->
  <g fill="#cfe6d3" opacity="0.55">
    <ellipse cx="120" cy="150" rx="85" ry="60"/>
    <ellipse cx="700" cy="690" rx="90" ry="55"/>
    <ellipse cx="655" cy="120" rx="60" ry="40"/>
  </g>

  <!-- جاده پیرامونی -->
  <path d="M0 470 H800" stroke="#b9c8ee" stroke-width="46" fill="none"/>
  <path d="M0 470 H800" stroke="#ffffff" stroke-width="3" stroke-dasharray="26 20" opacity="0.9"/>
  <path d="M470 0 V800" stroke="#b9c8ee" stroke-width="46" fill="none"/>
  <path d="M470 0 V800" stroke="#ffffff" stroke-width="3" stroke-dasharray="26 20" opacity="0.9"/>

  <!-- سالن اصلی تولید (سقف شیب‌دار دندان‌ه‌ای) -->
  <g>
    <rect x="60" y="60" width="360" height="340" rx="14" fill="#c3cfe9"/>
    <rect x="60" y="60" width="360" height="340" rx="14" fill="none" stroke="#8fa3cf" stroke-width="4"/>
    <rect x="90" y="92" width="150" height="276" rx="8" fill="#dbe4f7"/>
    <rect x="252" y="92" width="136" height="130" rx="8" fill="#dbe4f7"/>
    <g stroke="#8fa3cf" stroke-width="3" opacity="0.8">
      <path d="M90 150 H240 M90 210 H240 M90 270 H240 M90 330 H240 M252 150 H388 M252 210 H388"/>
    </g>
    <rect x="268" y="250" width="100" height="70" rx="8" fill="#f8fafc"/>
    <rect x="280" y="262" width="76" height="46" fill="#bae6fd"/>
    <g fill="#8fa3cf">
      <rect x="320" y="340" width="26" height="26" rx="5"/>
      <rect x="356" y="340" width="26" height="26" rx="5"/>
    </g>
  </g>

  <!-- انبار و محوطه بارانداز -->
  <g>
    <rect x="60" y="430" width="180" height="150" rx="12" fill="#aebfd8"/>
    <rect x="60" y="430" width="180" height="150" rx="12" fill="none" stroke="#7f95c2" stroke-width="4"/>
    <rect x="176" y="466" width="56" height="78" rx="6" fill="#2b3a55"/>
    <rect x="90" y="470" width="60" height="20" fill="#e2e8f0"/>
    <rect x="90" y="500" width="60" height="20" fill="#e2e8f0"/>
  </g>

  <!-- کانتینرها -->
  <g>
    <rect x="260" y="430" width="86" height="46" rx="6" fill="#f2b8b5"/>
    <rect x="260" y="430" width="86" height="46" rx="6" fill="none" stroke="#d57268" stroke-width="3"/>
    <rect x="352" y="430" width="86" height="46" rx="6" fill="#cfe6d3"/>
    <rect x="352" y="430" width="86" height="46" rx="6" fill="none" stroke="#6f9d78" stroke-width="3"/>
    <rect x="352" y="482" width="76" height="40" rx="6" fill="#c9d4f5"/>
    <rect x="352" y="482" width="76" height="40" rx="6" fill="none" stroke="#7086c9" stroke-width="3"/>
  </g>

  <!-- مخازن روزمینی -->
  <g fill="#aec1f4" stroke="#7f95c2" stroke-width="4">
    <circle cx="180" cy="640" r="52"/>
    <circle cx="300" cy="640" r="38"/>
    <circle cx="180" cy="640" r="34" fill="none" stroke="#7f95c2" stroke-width="3" opacity="0.5"/>
  </g>

  <!-- پارکینگ و کامیون‌ها -->
  <g>
    <rect x="500" y="80" width="210" height="120" rx="10" fill="#c3cfe9"/>
    <path d="M500 140 H710 M500 160 H710" stroke="#ffffff" stroke-width="3" opacity="0.85"/>
    <rect x="516" y="96" width="52" height="34" rx="6" fill="#4f46e5"/>
    <rect x="578" y="96" width="52" height="34" rx="6" fill="#64748b"/>
    <rect x="640" y="96" width="52" height="34" rx="6" fill="#94a3b8"/>
    <rect x="516" y="172" width="52" height="34" rx="6" fill="#64748b"/>
    <rect x="578" y="172" width="52" height="34" rx="6" fill="#4f46e5"/>
    <rect x="640" y="172" width="52" height="34" rx="6" fill="#94a3b8"/>
  </g>

  <!-- ساختمان اداری -->
  <g>
    <rect x="500" y="250" width="250" height="180" rx="12" fill="#ccd6ee"/>
    <rect x="500" y="250" width="250" height="180" rx="12" fill="none" stroke="#8fa3cf" stroke-width="4"/>
    <defs>
      <pattern id="win" width="34" height="30" patternUnits="userSpaceOnUse">
        <rect x="4" y="4" width="24" height="20" rx="4" fill="#bae6fd"/>
      </pattern>
    </defs>
    <rect x="520" y="270" width="100" height="140" fill="url(#win)"/>
    <rect x="634" y="270" width="96" height="68" fill="url(#win)"/>
    <rect x="620" y="360" width="110" height="50" rx="8" fill="#f8fafc"/>
    <rect x="630" y="372" width="90" height="26" fill="#a5b4fc"/>
  </g>

  <!-- درختان -->
  <g fill="#7fb98a">
    <circle cx="430" cy="70" r="16"/><circle cx="470" cy="90" r="13"/>
    <circle cx="430" cy="640" r="15"/><circle cx="470" cy="700" r="14"/>
    <circle cx="50" cy="730" r="16"/><circle cx="120" cy="760" r="14"/>
    <circle cx="690" cy="420" r="15"/><circle cx="740" cy="470" r="14"/>
  </g>

  <!-- وسایل نقلیه در جاده -->
  <g>
    <rect x="300" y="452" width="96" height="30" rx="5" fill="#64748b"/>
    <rect x="390" y="446" width="56" height="30" rx="6" fill="#f59e0b"/>
    <circle cx="320" cy="486" r="9" fill="#1e293b"/>
    <circle cx="412" cy="486" r="9" fill="#1e293b"/>
  </g>
  <g>
    <rect x="520" y="340" width="30" height="80" rx="5" fill="#64748b"/>
    <rect x="526" y="360" width="18" height="34" fill="#fffbeb"/>
  </g>
</svg>